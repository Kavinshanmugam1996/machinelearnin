version: 1.0

runtime: python311

build:
  commands:
    build:
      - pip install -r backend/requirements.txt

run:
  command: uvicorn main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
    - name: ALLOW_INSECURE_DEV
      value: "false"
    - name: ALGORITHM
      value: "HS256"
    - name: ACCESS_TOKEN_EXPIRE_MINUTES
      value: "60"
    # Set these in the App Runner console — never commit real values here
    # - name: SECRET_KEY
    #   value: ""
    # - name: DATABASE_URL
    #   value: "postgresql+asyncpg://user:pass@your-rds-host:5432/aires"
    # - name: CORS_ORIGINS
    #   value: "https://your-app.awsapprunner.com"
    # - name: S3_BUCKET
    #   value: "aires-assessments-prod"
    # - name: AWS_DEFAULT_REGION
    #   value: "us-east-1"
