      }

    }

      box-shadow: none;

      100% {

  <script>
    window.onerror = function (msg, url, lineNo, colNo, error) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; top: 0; left: 0; right: 0; padding: 20px; background: red; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>CRITICAL ERROR:</strong> " + msg + "<br/>Line: " + lineNo + " Col: " + colNo;
      document.body.prepend(errEl);
    };
    window.addEventListener('unhandledrejection', function (event) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: darkred; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>PROMISE REJECTION:</strong> " + (event.reason && event.reason.message ? event.reason.message : event.reason);
      document.body.appendChild(errEl);
    });
  </script>

  <script type="text/babel" data-presets="react,env">

      "Domain 3: Responsible AI & Ethics": "Focuses on human oversight and societal impact. Includes mechanisms for 'Human-in-the-loop' escalation, bias/fairness auditing in feature stores, and robust explainability (XAI) to ensure decisions are justifiable and fair.",

    // ─── DATA ─────────────────────────────────────────────────────────────────────
    const MANDATORY_COMPONENT_GROUPS = ["privacy", "security", "reliability", "legal_regulatory"];

    // These will be populated dynamically from CSV/JSON files
    let AI_USE_CASES = [];
    let QUESTION_MAPPER = {};
    let ALL_QUESTIONS = [];
    let RISK_DB = {};

    // ─── CSV PARSER ───────────────────────────────────────────────────────────────
    function parseCSV(text) {
      const lines = text.trim().split("\n").map(l => l.trim().replace(/\r$/, ""));
      if (lines.length === 0) return [];
      const headers = lines[0].split(",").map(h => h.trim());
      return lines.slice(1).map(line => {
        const vals = line.split(",").map(v => v.trim().replace(/^"|"$/g, ""));
        const obj = {};
        headers.forEach((h, i) => { obj[h] = vals[i] || ""; });
        return obj;
      });
    }

    // ─── DATA LOADER ──────────────────────────────────────────────────────────────
    async function loadAllData() {
      // Load Question_mapper.csv → AI_USE_CASES + QUESTION_MAPPER (Added cache buster)
      const mapperRes = await fetch(`Data/Question_mapper.csv?v=${Date.now()}`);
      const mapperText = await mapperRes.text();
      const mapperLines = mapperText.trim().split("\n").map(l => l.trim().replace(/\r$/, ""));
      const componentHeaders = mapperLines[0].split(",").map(h => h.trim()).slice(1); // skip first col "AI systems"

      AI_USE_CASES = [];
      QUESTION_MAPPER = {};
      for (let i = 1; i < mapperLines.length; i++) {
        const vals = mapperLines[i].split(",").map(v => v.trim());
        const useCase = vals[0].trim();
        if (!useCase) continue;
        AI_USE_CASES.push(useCase);
        // Collect component groups where the weight is non-zero
        const groups = [];
        for (let j = 1; j < vals.length; j++) {
          const weight = parseFloat(vals[j]);
          if (weight && weight > 0 && componentHeaders[j - 1]) {
            groups.push(componentHeaders[j - 1]);
          }
        }
        QUESTION_MAPPER[useCase] = groups;
      }

      // Load questions.json → ALL_QUESTIONS (Added cache buster)
      const questionsRes = await fetch(`Data/questions.json?v=${Date.now()}`);
      ALL_QUESTIONS = await questionsRes.json();

      // Load AR_Risk_DB.csv → RISK_DB (QID → array of risk descriptions) (Added cache buster)
      const riskRes = await fetch(`Data/AR_Risk_DB.csv?v=${Date.now()}`);
      const riskText = await riskRes.text();
      const riskLines = riskText.trim().split("\n").map(l => l.trim().replace(/\r$/, ""));
      RISK_DB = {};
      for (let i = 1; i < riskLines.length; i++) {
        // CSV may have commas inside quoted fields, simple parse for first 3 columns
        const match = riskLines[i].match(/^([^,]+),([^,]+),"?(.*?)"?(?:,|$)/);
        if (match) {
          const qid = match[1].trim();
          const riskId = match[2].trim();
          const desc = match[3].trim();
          if (!RISK_DB[qid]) RISK_DB[qid] = [];
          RISK_DB[qid].push({ riskId, desc });
        }
      }

      console.log("[AIRES] Data loaded:", AI_USE_CASES.length, "use cases,", ALL_QUESTIONS.length, "questions,", Object.keys(RISK_DB).length, "risk entries");
    }

    function getRelevantQuestions(aiInventory) {
      const allGroups = new Set(MANDATORY_COMPONENT_GROUPS);
      aiInventory.forEach(({ useCase }) => {
        (QUESTION_MAPPER[useCase] || []).forEach(g => allGroups.add(g));
      });
      return ALL_QUESTIONS.filter(q => q.is_universal || allGroups.has(q.component_group));
    }

    // ─── PAGE 4: QUESTION FLOW ────────────────────────────────────────────────────
    function QuestionFlow({ profile, onBack, onFinish, initialIndex = 0, onIndexChange, initialAnswers = {}, onAnswersChange, clients, activeClientId, onSwitchClient, onLogout, onExit }) {
      const questions = getRelevantQuestions(profile.inventory);
      const [current, setCurrent] = useState(initialIndex);

      useEffect(() => {
        if (onIndexChange) onIndexChange(current);
      }, [current]);

      const [answers, setAnswers] = useState(initialAnswers);
      const [fade, setFade] = useState(false);

      useEffect(() => {
        if (onAnswersChange) onAnswersChange(answers);
      }, [answers]);

      const q = questions[current];
      const pct = Math.round(((current + 1) / questions.length) * 100);
      const clusterColor = CLUSTER_COLORS[q?.cluster] || B.blue;
      const isMandatory = MANDATORY_COMPONENT_GROUPS.includes(q?.component_group);

      const go = (val) => {
        if (fade) return;
        const next = { ...answers, [q.qid]: val };
        setAnswers(next);
        setFade(true);
        setTimeout(() => {
          if (current < questions.length - 1) setCurrent(c => c + 1);
          else onFinish(next, questions);
          setFade(false);
        }, 220);
      };

      const prev = () => {
        if (fade) return;
        setFade(true);
        setTimeout(() => {
          if (current > 0) setCurrent(c => c - 1);
          else onBack();
          setFade(false);
        }, 220);
      };

      const customOpts = q?.options?.length > 0 ? q.options : ["Yes", "No", "Maybe", "Non-applicable"];
      const opts = customOpts.map(opt => {
        if (opt.startsWith("Partial") || opt.startsWith("Maybe")) return { label: opt, color: B.blue, bg: "#EFF6FF", border: "#93C5FD" };
        if (opt.startsWith("No") || opt.startsWith("Non-compliant") || opt.startsWith("Not-compliant")) return { label: opt, color: B.red, bg: "#FEF2F2", border: "#FECACA" };
        if (opt.startsWith("Yes") || opt.startsWith("Compliant") || opt.startsWith("Full")) return { label: opt, color: "#16A34A", bg: "#F0FDF4", border: "#86EFAC" };
        return { label: opt, color: B.gray500, bg: B.gray50, border: B.gray300 };
      });

      return (
        <div style={{ minHeight: "100vh", background: B.gray50, fontFamily: BODY }}>
          <Nav
            steps={["Company Profile", "AI Inventory", "Questions", "Risk Report"]}
            current={2}
            clients={clients}
            activeClientId={activeClientId}
            onSwitchClient={onSwitchClient}
            onLogout={onLogout}
          />

          {/* Progress header */}
          <div style={{ background: B.white, borderBottom: `1px solid ${B.border}`, padding: "16px 40px" }}>
            <div style={{ maxWidth: 760, margin: "0 auto", display: "flex", alignItems: "center", gap: 20 }}>
              <button onClick={prev} style={{
                background: "none", border: `1.5px solid ${B.border}`, borderRadius: 8,
                padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", gap: 6,
                fontSize: 13, fontWeight: 600, color: B.gray600, transition: "all 0.2s"
              }} onMouseOver={e => { e.currentTarget.style.borderColor = B.gray400; e.currentTarget.style.background = B.gray50; }}
                onMouseOut={e => { e.currentTarget.style.borderColor = B.border; e.currentTarget.style.background = "none"; }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back
              </button>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: B.black }}>
                    Question {current + 1} <span style={{ color: B.gray400 }}>of {questions.length}</span>
                  </span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: B.red }}>{pct}% complete</span>
                </div>
                <div style={{ height: 6, background: B.gray100, borderRadius: 4, overflow: "hidden" }}>
                  <div style={{
                    height: "100%", width: `${pct}%`,
                    background: `linear-gradient(90deg, ${B.red}, #E85558)`,
                    borderRadius: 4, transition: "width 0.4s ease"
                  }} />
                </div>
              </div>
            </div>
          </div>

          {/* Question card */}
          <div style={{ maxWidth: 760, margin: "40px auto", padding: "0 24px" }}>
            <div style={{
              opacity: fade ? 0 : 1, transform: fade ? "translateY(6px)" : "translateY(0)",
              transition: "opacity 0.2s, transform 0.2s"
            }}>
              {/* Metadata row */}
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                <span style={{
                  display: "inline-flex", alignItems: "center", gap: 5,
                  padding: "4px 10px", borderRadius: 20, fontSize: 11, fontWeight: 600,
                  background: clusterColor + "15", color: clusterColor, border: `1px solid ${clusterColor}33`
                }}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: clusterColor }} />
                  {q?.cluster?.replace("Cluster ", "").replace(" — ", " · ")}
                </span>
                {isMandatory && (
                  <span style={{
                    padding: "4px 10px", borderRadius: 20, fontSize: 11, fontWeight: 700,
                    background: "#FEF9C3", color: "#A16207", border: "1px solid #FDE047"
                  }}>⚡ Mandatory</span>
                )}
                <span style={{ padding: "4px 10px", borderRadius: 20, fontSize: 11, background: B.gray100, color: B.gray500, border: `1px solid ${B.border}` }}>
                  {q?.qid}
                </span>
              </div>

              {/* Question */}
              <div style={{
                background: B.white, border: `1px solid ${B.border}`, borderRadius: 14,
                padding: "36px 36px 28px", boxShadow: B.shadowMd,
                borderLeft: `4px solid ${clusterColor}`
              }}>
                <p style={{ fontSize: 19, fontWeight: 600, color: B.black, lineHeight: 1.6, margin: "0 0 32px", letterSpacing: "-0.1px" }}>
                  {q?.text}
                </p>

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {opts.map(opt => {
                    const selected = answers[q?.qid] === opt.label;
                    return (
                      <button key={opt.label} onClick={() => go(opt.label)} style={{
                        padding: "14px 20px", cursor: "pointer",
                        background: selected ? opt.bg : B.white,
                        border: `1.5px solid ${selected ? opt.color : B.border}`,
                        borderRadius: 10, fontSize: 14, fontWeight: selected ? 700 : 500,
                        color: selected ? opt.color : B.gray700,
                        transition: "all 0.12s", textAlign: "left",
                        display: "flex", alignItems: "center", gap: 10
                      }}>
                        <span style={{
                          width: 18, height: 18, borderRadius: "50%", flexShrink: 0,
                          border: `2px solid ${selected ? opt.color : B.gray300}`,
                          background: selected ? opt.color : "transparent",
                          display: "flex", alignItems: "center", justifyContent: "center"
                        }}>
                          {selected && <span style={{ width: 7, height: 7, borderRadius: "50%", background: B.white }} />}
                        </span>
                        {opt.label}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Nav row */}
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16 }}>
                <button onClick={() => current > 0 && setCurrent(c => c - 1)} disabled={current === 0}
                  style={{
                    padding: "10px 20px", background: "transparent",
                    border: `1px solid ${B.border}`, borderRadius: 8,
                    color: current === 0 ? B.gray300 : B.gray700, cursor: current === 0 ? "not-allowed" : "pointer",
                    fontSize: 13, fontWeight: 500
                  }}>
                  ← Back
                </button>
                <button onClick={() => onExit ? onExit() : null} style={{
                  padding: "10px 20px", background: "transparent",
                  border: `1px solid ${B.border}`, borderRadius: 8,
                  color: B.red, cursor: "pointer", fontSize: 13, fontWeight: 600
                }}>
                  Save & Exit
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── PAGE 5: RISK REPORT ──────────────────────────────────────────────────────
    function RiskReport({ profile, answers, questions }) {
      return (
        <div style={{ minHeight: "100vh", background: B.gray50, fontFamily: BODY, display: "flex", flexDirection: "column" }}>
          <Nav steps={["Company Profile", "AI Inventory", "Questions", "Complete"]} current={3} />

          <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
            <div style={{ background: B.white, border: `1px solid ${B.border}`, borderRadius: 16, padding: "56px 40px", maxWidth: 640, width: "100%", textAlign: "center", boxShadow: B.shadowLg }}>
              <div style={{ width: 72, height: 72, background: "#F0FDF4", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 28px" }}>
                <span style={{ fontSize: 32, color: "#16A34A", fontWeight: "bold" }}>✓</span>
              </div>
              <h1 style={{ fontSize: 28, fontWeight: 800, color: B.black, margin: "0 0 16px", fontFamily: DISPLAY, letterSpacing: "-0.5px" }}>
                Assessment Complete
              </h1>
              <p style={{ fontSize: 18, color: B.gray700, lineHeight: 1.6, margin: "0 0 10px" }}>
                Thank you for completing the assessment.
              </p>
              <p style={{ fontSize: 18, color: B.gray700, lineHeight: 1.6, margin: "0 0 40px" }}>
                <strong>Our team will send you the detailed report within 24-48 Hours.</strong>
              </p>
              <div style={{ borderTop: `1px solid ${B.border}`, paddingTop: 32, display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
                <BizcomLogo size={40} />
                <div style={{ fontSize: 12, fontWeight: 700, color: B.gray400, textTransform: "uppercase", letterSpacing: "0.1em" }}>Powered by Bizcom AI</div>
              </div>
              <button onClick={() => window.location.reload()} style={{
                padding: "15px 40px", background: B.red, border: "none", borderRadius: 8,
                color: B.white, fontSize: 15, fontWeight: 700, cursor: "pointer"
              }}>
                Return Home
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── APP ──────────────────────────────────────────────────────────────────────
    function App() {

      useFonts();
      const [page, setPage] = useState("loading");

      // Client Management
      const [clients, setClients] = useState([]);
      const [activeClientId, setActiveClientId] = useState(() => {
        return localStorage.getItem("AIRES_active_client") || "default";
      });

      // Client-specific persistences
      const [profile, setProfile] = useState(null);
      const [answers, setAnswers] = useState({});
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);

      const [questions, setQuestions] = useState([]);
      const [loadError, setLoadError] = useState("");

      // Server Sync Logic
      const syncToServer = async () => {
        if (!profile) return;
        try {
          const activeClient = clients.find(c => c.id === activeClientId);
          const payload = {
            id: activeClientId,
            name: activeClient ? activeClient.name : "Default Client",
            profile,
            answers,
            currentQuestionIndex
          };
          await fetch("/api/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          console.log("[AIRES] Synced to server:", activeClientId);
        } catch (err) {
          console.error("[AIRES] Failed to sync to server:", err);
        }
      };

      // Initial load: Data + Clients
      useEffect(() => {
        const init = async () => {
          try {
            await loadAllData();

            // Load clients from server
            const res = await fetch("/api/clients");
            const serverClients = await res.json();

            if (serverClients.length > 0) {
              setClients(serverClients);
            } else {
              setClients([{ id: "default", name: "Default Client" }]);
            }

            setPage("login");
          } catch (err) {
            console.error("[AIRES] Failed to initialize:", err);
            setLoadError("Failed to load data. Make sure you are running via the local server (python server.py) and opening http://localhost:3000/risk_profiler.html");
          }
        };
        init();
      }, []);

      // Load active client data when client switches
      useEffect(() => {
        const pKey = `AIRES_client_${activeClientId}_profile`;
        const aKey = `AIRES_client_${activeClientId}_answers`;
        const iKey = `AIRES_client_${activeClientId}_q_index`;

        const savedP = localStorage.getItem(pKey);
        const savedA = localStorage.getItem(aKey);
        const savedI = localStorage.getItem(iKey);

        setProfile(savedP ? JSON.parse(savedP) : null);
        setAnswers(savedA ? JSON.parse(savedA) : {});
        setCurrentQuestionIndex(savedI ? parseInt(savedI) : 0);

        localStorage.setItem("AIRES_active_client", activeClientId);
      }, [activeClientId]);

      // Sync state to keyed localStorage AND Server
      useEffect(() => {
        if (profile) {
          localStorage.setItem(`AIRES_client_${activeClientId}_profile`, JSON.stringify(profile));
          syncToServer();
        } else {
          localStorage.removeItem(`AIRES_client_${activeClientId}_profile`);
        }
      }, [profile, activeClientId]);

      useEffect(() => {
        localStorage.setItem(`AIRES_client_${activeClientId}_answers`, JSON.stringify(answers));
        syncToServer();
      }, [answers, activeClientId]);

      useEffect(() => {
        localStorage.setItem(`AIRES_client_${activeClientId}_q_index`, currentQuestionIndex.toString());
        syncToServer();
      }, [currentQuestionIndex, activeClientId]);

      useEffect(() => {
        localStorage.setItem("AIRES_clients", JSON.stringify(clients));
      }, [clients]);

      const switchClient = (id, name) => {
        if (id === "new") {
          const nid = "c_" + Date.now();
          const updatedClients = [...clients, { id: nid, name }];
          setClients(updatedClients);
          setActiveClientId(nid);
          setPage("landing");
        } else {
          setActiveClientId(id);
          setPage("landing");
        }
      };

      const logout = () => {
        setPage("login");
      };

      if (loadError) {
        return (
          <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0A0F1D", fontFamily: BODY }}>
            <div style={{ textAlign: "center", maxWidth: 560, padding: 40 }}>
              <div style={{ fontSize: 48, marginBottom: 24 }}>⚠️</div>
              <h2 style={{ color: "white", fontSize: 24, fontWeight: 800, marginBottom: 16, fontFamily: DISPLAY }}>Data Loading Error</h2>
              <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 15, lineHeight: 1.6, marginBottom: 32 }}>{loadError}</p>
              <button onClick={() => window.location.reload()} className="auth-btn" style={{ padding: "14px 32px", fontSize: 15 }}>Retry</button>
            </div>
          </div>
        );
      }

      if (page === "loading") {
        return (
          <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#0A0F1D", fontFamily: BODY }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ width: 48, height: 48, border: "4px solid rgba(255,255,255,0.1)", borderTopColor: B.blue, borderRadius: "50%", animation: "spin 1s linear infinite", margin: "0 auto 24px" }} />
              <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 15, fontWeight: 500 }}>Loading data...</p>
            </div>
          </div>
        );
      }

      const cleanReset = () => {
        localStorage.removeItem(`AIRES_client_${activeClientId}_profile`);
        localStorage.removeItem(`AIRES_client_${activeClientId}_answers`);
        localStorage.removeItem(`AIRES_client_${activeClientId}_q_index`);
        setProfile(null);
        setAnswers({});
        setCurrentQuestionIndex(0);
        setPage("profile");
      };

      const resume = () => {
        if (profile && Object.keys(answers).length > 0) setPage("questions");
        else setPage("profile");
      };

      return (
        <div style={{ fontFamily: BODY }}>
          {page === "login" && <AdminLogin onLogin={() => setPage("landing")} />}
          {page === "landing" && (
            <LandingPage
              onBegin={cleanReset}
              onResume={resume}
              hasSaved={!!profile}
              clients={clients}
              activeClientId={activeClientId}
              onSwitchClient={switchClient}
              onLogout={logout}
            />
          )}
          {page === "profile" && <CompanyProfile
            onNext={p => {
              setProfile(p);
              if (p.companyName) {
                setClients(prev => prev.map(c => c.id === activeClientId ? { ...c, name: p.companyName } : c));
              }
              setPage("questions");
            }}
            clients={clients}
            activeClientId={activeClientId}
            onSwitchClient={switchClient}
            onLogout={logout}
          />}
          {page === "questions" && profile && (
            <QuestionFlow
              profile={profile}
              onBack={() => setPage("profile")}
              onFinish={(a, q) => {
                setAnswers(a);
                setQuestions(q);
                setPage("results");
                // Clear storage on successful finish for THIS client
                localStorage.removeItem(`AIRES_client_${activeClientId}_profile`);
                localStorage.removeItem(`AIRES_client_${activeClientId}_answers`);
                localStorage.removeItem(`AIRES_client_${activeClientId}_q_index`);
              }}
              onExit={() => setPage("landing")}
              initialIndex={currentQuestionIndex}
              onIndexChange={setCurrentQuestionIndex}
              initialAnswers={answers}
              onAnswersChange={setAnswers}
              clients={clients}
              activeClientId={activeClientId}
              onSwitchClient={switchClient}
              onLogout={logout}
            />
          )}
          {page === "results" && profile && (
            <RiskReport
              profile={profile}
              answers={answers}
              questions={questions}
              clients={clients}
              activeClientId={activeClientId}
              onSwitchClient={switchClient}
              onLogout={logout}
            />
          )}
        </div>
      );
    }


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
