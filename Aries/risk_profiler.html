  <style>
    body { margin: 0; padding: 0; background: #0A0E1A; font-family: sans-serif; }
    * { box-sizing: border-box; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    /* Modern UI Classes */
    .auth-card {
      background: white;
      border-radius: 20px;
      padding: 48px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.03);
      border: 1px solid rgba(226, 228, 233, 0.8);
    }
    .auth-input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #E2E4E9;
      border-radius: 12px;
      font-size: 15px;
      color: #0D0D0D;
      background: #FAFAFA;
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .auth-input:focus {
      border-color: #3B9BC8;
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(59, 155, 200, 0.15);
    }
    .auth-input.error {
      border-color: #C8181E;
      background: #FFF;
    }
    .auth-input.error:focus {
      box-shadow: 0 0 0 4px rgba(200, 24, 30, 0.15);
    }
    .auth-btn {
      margin-top: 12px;
      padding: 16px;
      background: linear-gradient(135deg, #C8181E 0%, #A51015 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(200, 24, 30, 0.2);
    }
    .auth-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(200, 24, 30, 0.3);
      background: linear-gradient(135deg, #dc1a21 0%, #b81218 100%);
    }
    .auth-btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(200, 24, 30, 0.2);
    }
    .auth-btn:disabled {
      background: #C4C4C4;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Left Panel Styles */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-15px) rotate(-5deg) scale(1.05); }
      100% { transform: translateY(0px) rotate(0deg) scale(1); }
    }
    .hero-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: float1 10s ease-in-out infinite;
      pointer-events: none;
    }
    .trust-badge {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px 20px;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 110px;
    }
    .trust-badge:hover {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

  <script>
    window.onerror = function(msg, url, lineNo, colNo, error) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; top: 0; left: 0; right: 0; padding: 20px; background: red; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>CRITICAL ERROR:</strong> " + msg + "<br/>Line: " + lineNo + " Col: " + colNo;
      document.body.prepend(errEl);
    };
    window.addEventListener('unhandledrejection', function(event) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: darkred; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>PROMISE REJECTION:</strong> " + (event.reason && event.reason.message ? event.reason.message : event.reason);
      document.body.appendChild(errEl);
    });
  </script>

// ─── UTILS ───────────────────────────────────────────────────────────────────

function getRelevantQuestions(aiInventory) {
  const allGroups = new Set(MANDATORY_COMPONENT_GROUPS);
  aiInventory.forEach(({ useCase }) => {
    const groups = QUESTION_MAPPER[useCase] || [];
    groups.forEach(g => allGroups.add(g));
  });
  return ALL_QUESTIONS.filter(q => allGroups.has(q.component_group));
}

// ─── COMPONENTS ──────────────────────────────────────────────────────────────

function ProgressBar({ current, total, label }) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  return (
    <div style={{ width: "100%" }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ color: colors.textMuted, fontSize: 12 }}>{label}</span>
        <span style={{ color: colors.gold, fontSize: 12, fontWeight: 600 }}>{current}/{total}</span>
      </div>
      <div style={{ height: 4, background: colors.border, borderRadius: 4, overflow: "hidden" }}>
        <div style={{
          height: "100%", width: `${pct}%`, background: `linear-gradient(90deg, ${colors.gold}, ${colors.goldLight})`,
          borderRadius: 4, transition: "width 0.5s ease"
        }} />
      </div>
    </div>
  );
}

function Badge({ label, color = colors.gold }) {
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", padding: "2px 10px",
      background: color + "22", color, borderRadius: 20,
      fontSize: 11, fontWeight: 600, letterSpacing: "0.04em",
      border: `1px solid ${color}44`
    }}>{label}</span>
  );
}

function QuestionFlow({ profile, onFinish }) {
  const questions = getRelevantQuestions(profile.inventory);
  const [current, setCurrent] = useState(0);
  const [answers, setAnswers] = useState({});
  const [animating, setAnimating] = useState(false);

  const q = questions[current];
  const progress = current / questions.length;
  const isMandatory = MANDATORY_COMPONENT_GROUPS.includes(q?.component_group);

  const responseOptions = q?.options?.length > 0 ? q.options : ["Yes", "No", "Maybe", "Non-applicable"];

  const handleAnswer = (val) => {
    if (animating) return;
    const newAnswers = { ...answers, [q.qid]: val };
    setAnswers(newAnswers);
    setAnimating(true);
    setTimeout(() => {
      if (current < questions.length - 1) {
        setCurrent(c => c + 1);
      } else {
        onFinish(newAnswers, questions);
      }
      setAnimating(false);
    }, 300);
  };

  const handleBack = () => {
    if (current > 0) setCurrent(c => c - 1);
  };

  const clusterColor = CLUSTER_COLORS[q?.cluster] || colors.gold;

  return (
    <div style={{
      minHeight: "100vh", background: colors.bg, color: colors.text,
      fontFamily: "'Georgia', 'Times New Roman', serif",
      display: "flex", flexDirection: "column"
    }}>
      {/* Top progress */}
      <div style={{
        padding: "20px 48px", borderBottom: `1px solid ${colors.border}`,
        background: colors.bgCard
      }}>
        <div style={{ maxWidth: 800, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 6, height: 6, background: colors.gold, borderRadius: "50%" }} />
              <span style={{ color: colors.text, fontSize: 13, fontWeight: 600 }}>AI Risk Assessment</span>
            </div>
            <span style={{ color: colors.textMuted, fontSize: 12 }}>
              Question {current + 1} of {questions.length}
            </span>
          </div>
          <div style={{ height: 4, background: colors.border, borderRadius: 4, overflow: "hidden" }}>
            <div style={{
              height: "100%", width: `${((current + 1) / questions.length) * 100}%`,
              background: `linear-gradient(90deg, ${colors.gold}, ${colors.goldLight})`,
              borderRadius: 4, transition: "width 0.4s ease"
            }} />
          </div>
        </div>
      </div>

      {/* Question */}
      <div style={{
        flex: 1, display: "flex", alignItems: "center", justifyContent: "center",
        padding: "48px 24px"
      }}>
        <div style={{
          width: "100%", maxWidth: 680,
          opacity: animating ? 0 : 1, transform: animating ? "translateY(8px)" : "translateY(0)",
          transition: "opacity 0.25s, transform 0.25s"
        }}>
          {/* Cluster + mandatory badges */}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
            <Badge label={q?.cluster?.replace("Cluster ", "C").replace(" — ", " · ")} color={clusterColor} />
            {isMandatory && <Badge label="● Mandatory" color={colors.goldLight} />}
            <Badge label={q?.component_group?.replace(/_/g, " ").toUpperCase()} color={colors.textMuted} />
          </div>

          {/* Question text */}
          <div style={{
            background: colors.bgCard, border: `1px solid ${colors.border}`,
            borderRadius: 16, padding: "40px 40px 32px",
            borderLeft: `4px solid ${clusterColor}`
          }}>
            <div style={{ fontSize: 11, color: colors.textMuted, letterSpacing: "0.1em", marginBottom: 16 }}>
              {q?.qid}
            </div>
            <h2 style={{ fontSize: 20, fontWeight: 600, lineHeight: 1.6, margin: "0 0 36px", color: colors.text }}>
              {q?.text}
            </h2>

            {/* Answer buttons */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {responseOptions.map(opt => {
                const isSelected = answers[q?.qid] === opt;
                const optColor = opt === "Yes" ? colors.success : opt === "No" ? colors.error : opt === "Maybe" ? colors.info : colors.textMuted;
                return (
                  <button
                    key={opt}
                    onClick={() => handleAnswer(opt)}
                    style={{
                      padding: "16px 24px", background: isSelected ? `${optColor}25` : colors.bg,
                      border: `1px solid ${isSelected ? optColor : colors.border}`,
                      borderRadius: 10, color: isSelected ? optColor : colors.textMuted,
                      fontSize: 14, fontWeight: isSelected ? 700 : 500,
                      cursor: "pointer", transition: "all 0.15s", textAlign: "left",
                      display: "flex", alignItems: "center", gap: 10
                    }}
                  >
                    <span style={{
                      width: 20, height: 20, borderRadius: "50%",
                      border: `2px solid ${isSelected ? optColor : colors.border}`,
                      background: isSelected ? optColor : "transparent",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      flexShrink: 0
                    }}>
                      {isSelected && <span style={{ width: 8, height: 8, background: "#000", borderRadius: "50%" }} />}
                    </span>
                    {opt}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Navigation */}
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 20 }}>
            <button
              onClick={handleBack} disabled={current === 0}
              style={{
                padding: "10px 24px", background: "transparent",

              style={{
                padding: "10px 24px", background: "transparent",
                border: `1px solid ${colors.border}`, borderRadius: 8,
                color: colors.textMuted, cursor: "pointer", fontSize: 13
              }}
            >
              Skip →
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── PAGE 5: RESULTS ──────────────────────────────────────────────────────────

function RiskReport({ profile, answers, questions }) {
  const total = questions.length;
  const answered = Object.keys(answers).length;

  // New Scoring Logic based on trigger_points
  const scored = questions.filter(q => answers[q.qid] && answers[q.qid] !== "Non-applicable" && answers[q.qid] !== "Not Applicable");
  const totalScore = scored.length > 0
    ? Math.round(scored.reduce((sum, q) => {
        const ans = answers[q.qid];
        // If it's a legacy Yes/No question, Yes = 100, No = 0, Maybe = 50
        if (!q.trigger_points) {
           return sum + (ans === "Yes" ? 100 : ans === "Maybe" ? 50 : 0);
        }
        
        // If it has trigger points, find if the answer is a trigger point
        // Trigger points mean risk = bad score.
        // The DB might specify "Partial | No" as triggers.
        // We will grant 100 points for non-triggers, 0 for triggers.
        const triggers = q.trigger_points.split('|').map(t => t.trim());
        // Simple heuristic: Does the chosen answer match or start with a trigger string?
        const isTrigger = triggers.some(t => ans.startsWith(t));
        return sum + (isTrigger ? 0 : 100);
      }, 0) / scored.length)
    : 0;

  const riskLevel = totalScore >= 75 ? { label: "Low Risk", color: colors.success } :
    totalScore >= 50 ? { label: "Moderate Risk", color: colors.info } :
    totalScore >= 25 ? { label: "High Risk", color: colors.gold } :
    { label: "Critical Risk", color: colors.error };

  // Group by cluster
  const clusterStats = {};
  questions.forEach(q => {
    if (!clusterStats[q.cluster]) clusterStats[q.cluster] = { total: 0, safe: 0, risk: 0, skipped: 0 };
    const a = answers[q.qid];
    clusterStats[q.cluster].total++;
    
    if (!a || a === "Non-applicable" || a === "Not Applicable") {
      clusterStats[q.cluster].skipped++;
    } else {
      if (!q.trigger_points) {
         if (a === "Yes") clusterStats[q.cluster].safe++;
         else if (a === "No") clusterStats[q.cluster].risk++;
      } else {
         const triggers = q.trigger_points.split('|').map(t => t.trim());
         const isTrigger = triggers.some(t => a.startsWith(t));
         if (isTrigger) clusterStats[q.cluster].risk++;
         else clusterStats[q.cluster].safe++;
      }
    }
  });

  const gaps = questions.filter(q => {
     const a = answers[q.qid];
     if (!a) return false;
     if (!q.trigger_points) return a === "No";
     const triggers = q.trigger_points.split('|').map(t => t.trim());
     return triggers.some(t => a.startsWith(t));
  }).slice(0, 5);

  return (
    <div style={{
      minHeight: "100vh", background: colors.bg, color: colors.text,
      fontFamily: "'Georgia', 'Times New Roman', serif", padding: "48px 24px"
    }}>
      <div style={{ maxWidth: 820, margin: "0 auto" }}>
        {/* Header */}
        <div style={{ textAlign: "center", marginBottom: 48 }}>
          <div style={{
            display: "inline-flex", background: `${colors.gold}15`,
            border: `1px solid ${colors.gold}44`, borderRadius: 20,
            padding: "4px 14px", marginBottom: 16
          }}>
            <span style={{ color: colors.gold, fontSize: 11, letterSpacing: "0.12em" }}>ASSESSMENT COMPLETE</span>
          </div>
          <h1 style={{ fontSize: 36, fontWeight: 700, margin: "0 0 8px" }}>Your AI Risk Profile</h1>
          <p style={{ color: colors.textMuted }}>{profile.companyName} · {profile.industry} · {profile.companySize}</p>
        </div>

        {/* Score card */}
        <div style={{
          background: colors.bgCard, border: `1px solid ${colors.borderGold}`,
          borderRadius: 16, padding: "40px", marginBottom: 24, textAlign: "center"
        }}>
          <div style={{
            width: 140, height: 140, borderRadius: "50%",
            background: `conic-gradient(${riskLevel.color} ${totalScore * 3.6}deg, ${colors.border} 0deg)`,
            display: "flex", alignItems: "center", justifyContent: "center",
            margin: "0 auto 20px", position: "relative"
          }}>
            <div style={{
              width: 110, height: 110, borderRadius: "50%",
              background: colors.bgCard, display: "flex", flexDirection: "column",
              alignItems: "center", justifyContent: "center"
            }}>
              <span style={{ fontSize: 32, fontWeight: 800, color: riskLevel.color }}>{totalScore}</span>
              <span style={{ fontSize: 11, color: colors.textMuted }}>/ 100</span>
            </div>
          </div>
          <div style={{ fontSize: 20, fontWeight: 700, color: riskLevel.color, marginBottom: 8 }}>{riskLevel.label}</div>
          <div style={{ color: colors.textMuted, fontSize: 14 }}>
            Answered {answered} of {total} questions · {gaps.length} critical gaps identified
          </div>
        </div>

        {/* Cluster breakdown */}
        <div style={{
          background: colors.bgCard, border: `1px solid ${colors.border}`,
          borderRadius: 16, padding: "32px", marginBottom: 24
        }}>
          <h3 style={{ margin: "0 0 24px", color: colors.gold, fontSize: 14, letterSpacing: "0.1em" }}>BREAKDOWN BY DOMAIN</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {Object.entries(clusterStats).map(([cluster, stats]) => {
              const clr = CLUSTER_COLORS[cluster] || colors.gold;
              const pct = stats.total > stats.skipped ? Math.round((stats.safe / (stats.total - stats.skipped)) * 100) : 0;
              return (
                <div key={cluster}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                    <span style={{ fontSize: 13, color: colors.text }}>{cluster}</span>
                    <div style={{ display: "flex", gap: 8 }}>
                      <span style={{ fontSize: 11, color: colors.success }}>✓ {stats.safe}</span>
                      <span style={{ fontSize: 11, color: colors.error }}>✗ {stats.risk}</span>
                      <span style={{ fontSize: 11, color: colors.textMuted }}>{stats.total} total</span>
                    </div>
                  </div>
                  <div style={{ height: 6, background: colors.border, borderRadius: 4, overflow: "hidden" }}>
                    <div style={{
                      height: "100%", width: `${pct}%`,
                      background: `linear-gradient(90deg, ${clr}, ${clr}99)`,
                      borderRadius: 4, transition: "width 0.8s ease"
                    }} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* AI Inventory used */}
        <div style={{
          background: colors.bgCard, border: `1px solid ${colors.border}`,
          borderRadius: 16, padding: "32px", marginBottom: 24
        }}>
          <h3 style={{ margin: "0 0 16px", color: colors.gold, fontSize: 14, letterSpacing: "0.1em" }}>AI INVENTORY ASSESSED</h3>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {profile.inventory.map((item, i) => (
              <Badge key={i} label={item.useCase} color={colors.info} />
            ))}
          </div>
        </div>

        {/* Critical gaps */}
        {gaps.length > 0 && (
          <div style={{
            background: colors.bgCard, border: `1px solid ${colors.error}44`,
            borderRadius: 16, padding: "32px", marginBottom: 24
          }}>
            <h3 style={{ margin: "0 0 16px", color: colors.error, fontSize: 14, letterSpacing: "0.1em" }}>
              ⚠ TOP COMPLIANCE GAPS
            </h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {gaps.map(q => (
                <div key={q.qid} style={{
                  background: `${colors.error}08`, border: `1px solid ${colors.error}22`,
                  borderRadius: 8, padding: "14px 16px",
                  borderLeft: `3px solid ${colors.error}`
                }}>
                  <div style={{ fontSize: 11, color: colors.error, marginBottom: 4 }}>{q.qid} · {q.component_group.replace(/_/g, " ")}</div>
                  <div style={{ fontSize: 13, color: colors.text, lineHeight: 1.5 }}>{q.text}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        <div style={{ textAlign: "center", paddingTop: 16 }}>
          <p style={{ color: colors.textMuted, fontSize: 13, marginBottom: 20 }}>
            This report is based on ISO 42001, NIST-RMF, and EU AI Act frameworks.
          </p>
          <button
            onClick={() => window.location.reload()}
            style={{
              padding: "14px 36px", background: `linear-gradient(135deg, ${colors.gold}, ${colors.goldLight})`,
              border: "none", borderRadius: 8, color: "#000", fontSize: 14,
              fontWeight: 700, cursor: "pointer"
            }}
          >
            Start New Assessment
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────

function App() {
  const [page, setPage] = useState("login"); // login | landing | profile | questions | results
  const [profile, setProfile] = useState(null);
  const [answers, setAnswers] = useState({});
  const [questions, setQuestions] = useState([]);

  return (
    <div>
      {page === "login" && <AdminLogin onLogin={() => setPage("landing")} />}
      {page === "landing" && <LandingPage onBegin={() => setPage("profile")} />}
      {page === "profile" && (
        <CompanyProfile onNext={(p) => {
          setProfile(p);
          setPage("questions");
        }} />
      )}
      {page === "questions" && profile && (
        <QuestionFlow
          profile={profile}
          onFinish={(a, q) => {
            setAnswers(a);
            setQuestions(q);
            setPage("results");
          }}
        />
      )}
      {page === "results" && profile && (
        <RiskReport profile={profile} answers={answers} questions={questions} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
