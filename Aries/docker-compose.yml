version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aires-db
    environment:
      POSTGRES_USER: ${DB_USER:-aires_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aires_pass}
      POSTGRES_DB: ${DB_NAME:-aires_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aires_user -d aires_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  aires-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: aires-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-aires_user}:${DB_PASSWORD:-aires_pass}@postgres:5432/${DB_NAME:-aires_db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "py -m alembic upgrade head && 
             uvicorn main:app --host 0.0.0.0 --port 3000 --reload"

volumes:
  postgres_data:
