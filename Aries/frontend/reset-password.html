<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AIRES™</title>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0?dev",
        "react-dom": "https://esm.sh/react-dom@18.2.0/client?dev",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>
  <link rel="stylesheet" href="src/styles/main.css?v=1.0.5">
  <style>
    body { margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom';
    import htm from 'htm';
    import { ResetPassword } from './src/features/ResetPassword.js?v=1.0.9';
    import { FONT_LINK } from './src/services/constants.js?v=1.0.6';

    window.html = htm.bind(React.createElement);
    window.React = React;

    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = FONT_LINK;
    document.head.appendChild(link);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ResetPassword, {
      onSuccess: () => { window.location.href = '/'; }
    }));
  </script>
</body>
</html>
