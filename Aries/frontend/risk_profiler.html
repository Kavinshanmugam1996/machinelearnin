<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRES™ Risk Profiler | Enterprise AI Governance</title>
  
  <!-- Dependencies -->
  <!-- Dependencies (ESM) -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0?dev",
          "react-dom": "https://esm.sh/react-dom@18.2.0/client?dev",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Global Styles -->
  <link rel="stylesheet" href="src/styles/main.css?v=1.0.5">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    /* Connection Error Fallback UI */
    #boot-error {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0A0F1D;
      color: white;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .error-card {
      max-width: 440px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .retry-btn {
      background: #3B9BC8;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.2s;
    }
    .retry-btn:hover { background: #4ca6d1; transform: translateY(-2px); }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Boot Failure Watchdog -->
  <div id="boot-error">
    <div class="error-card">
      <div style="font-size: 64px; margin-bottom: 24px;">📡</div>
      <h1 style="font-size: 28px; font-weight: 800; margin: 0 0 16px; letter-spacing: -1px;">Connection Interrupted</h1>
      <p style="color: rgba(255,255,255,0.6); line-height: 1.6; margin: 0;">
        We couldn't load the AIRES engine. This usually happens when you're offline or behind a restrictive firewall.
      </p>
      <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </div>

  <!-- Error Handling -->
  <script>
    // Watchdog Timer
    window._aires_booted = false;
    setTimeout(function() {
      if (!window._aires_booted) {
        document.getElementById('boot-error').style.display = 'flex';
      }
    }, 6000); // 6 second timeout for slow mobile/network

    window.onerror = function (msg, url, lineNo, colNo, error) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; top: 0; left: 0; right: 0; padding: 20px; background: red; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>CRITICAL ERROR:</strong> " + msg + "<br/>Line: " + lineNo + " Col: " + colNo;
      document.body.prepend(errEl);
    };
    window.addEventListener('unhandledrejection', function (event) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: darkred; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>PROMISE REJECTION:</strong> " + (event.reason && event.reason.message ? event.reason.message : event.reason);
      document.body.appendChild(errEl);
    });
  </script>

  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom';
    import htm from 'htm';
    import App from './src/App.js?v=1.0.8';
    import { FONT_LINK } from './src/services/constants.js?v=1.0.6';

    // Global HTM binding
    window.html = htm.bind(React.createElement);
    window.React = React;

    // Inject fonts
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = FONT_LINK;
    document.head.appendChild(link);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));

    // Signal successful boot to stop watchdog
    window._aires_booted = true;
  </script>
</body>

</html>
