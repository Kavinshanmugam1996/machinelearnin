<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIRES™ Risk Profiler | Enterprise AI Governance</title>
  
  <!-- Dependencies -->
  <!-- Dependencies (ESM) -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom": "https://esm.sh/react-dom@18.2.0/client",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Global Styles -->
  <link rel="stylesheet" href="src/styles/main.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Error Handling -->
  <script>
    window.onerror = function (msg, url, lineNo, colNo, error) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; top: 0; left: 0; right: 0; padding: 20px; background: red; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>CRITICAL ERROR:</strong> " + msg + "<br/>Line: " + lineNo + " Col: " + colNo;
      document.body.prepend(errEl);
    };
    window.addEventListener('unhandledrejection', function (event) {
      const errEl = document.createElement("div");
      errEl.style = "position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: darkred; color: white; z-index: 99999; font-size: 16px; font-family: sans-serif; opacity: 0.9;";
      errEl.innerHTML = "<strong>PROMISE REJECTION:</strong> " + (event.reason && event.reason.message ? event.reason.message : event.reason);
      document.body.appendChild(errEl);
    });
  </script>

  <!-- Main Entry Point -->
  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom';
    import htm from 'htm';
    import App from './src/App.js';
    import { FONT_LINK } from './src/services/constants.js';

    // Global HTM binding
    window.html = htm.bind(React.createElement);
    window.React = React;

    // Inject fonts
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = FONT_LINK;
    document.head.appendChild(link);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>

</html>
