name: AIRES CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Core API Tests (Pytest)
      run: |
        cd backend
        python -m pytest tests/

    - name: Build Docker Image (Final Check)
      if: success()
      run: |
        docker build -t aires-risk-profiler:latest backend/
