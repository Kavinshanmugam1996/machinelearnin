<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Registration Component</title>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0?dev",
        "react-dom": "https://esm.sh/react-dom@18.2.0/client?dev",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    .hero-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      animation: glow 20s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .auth-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 155, 200, 0.3);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom';
    import htm from 'htm';

    const html = htm.bind(React.createElement);
    window.html = html;
    window.React = React;

    // Import constants
    const B = {
      blue: "#3B9BC8",
      gray50: "#F9FAFB",
      gray300: "#D1D5DB",
      gray500: "#6B7280",
      gray600: "#4B5563",
      gray700: "#374151",
      black: "#111827",
      white: "#FFFFFF",
      border: "#E5E7EB"
    };
    const DISPLAY = "Inter, system-ui, sans-serif";
    const BODY = "Inter, system-ui, sans-serif";

    // Simple BizcomLogo component
    function BizcomLogo() {
      return html`
        <div style=${{ fontSize: 14, color: "rgba(255,255,255,0.5)" }}>
          Powered by <strong>Bizcom</strong>
        </div>
      `;
    }

    // Register component inline for testing
    const { useState } = React;

    function Register({ onBack, onSuccess }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [showPw, setShowPw] = useState(false);
      const [error, setError] = useState("");
      const [success, setSuccess] = useState("");
      const [loading, setLoading] = useState(false);

      const doRegister = async () => {
        setLoading(true);
        setError("");
        setSuccess("");

        // Validation
        if (!email) {
          setError("Email is required");
          setLoading(false);
          return;
        }

        if (password.length < 8) {
          setError("Password must be at least 8 characters");
          setLoading(false);
          return;
        }

        if (password !== confirmPassword) {
          setError("Passwords do not match");
          setLoading(false);
          return;
        }

        // Simulate API call
        try {
          console.log("Registering:", { email, password });
          setSuccess("Registration successful! Check your email for verification.");
          setTimeout(() => {
            if (onSuccess) onSuccess();
          }, 5000);
        } catch (err) {
          setError("Network error");
        } finally {
          setLoading(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !loading) {
          doRegister();
        }
      };

      return html`
        <div style=${{
          minHeight: "100vh", background: B.gray50,
          display: "flex", fontFamily: BODY
        }}>
          <div style=${{
            width: "48%", background: "linear-gradient(145deg, #0A0F1D 0%, #112240 50%, #0A0F1D 100%)",
            display: "flex", flexDirection: "column", justifyContent: "space-between",
            padding: "64px 72px", position: "relative", overflow: "hidden",
            borderRight: "1px solid rgba(255,255,255,0.05)",
            boxShadow: "inset -10px 0 20px rgba(0,0,0,0.2)"
          }}>
            <div className="hero-glow" style=${{ top: "-10%", left: "-10%", width: "60vh", height: "60vh", background: "rgba(59, 155, 200, 0.15)", animationDuration: "15s" }} />
            <div className="hero-glow" style=${{ bottom: "-20%", right: "-10%", width: "70vh", height: "70vh", background: "rgba(200, 24, 30, 0.1)", animationDuration: "18s", animationDelay: "-5s" }} />

            <div style=${{ position: "relative", zIndex: 1 }}>
              <div style=${{ display: "inline-flex", alignItems: "center", gap: 8, padding: "8px 16px", background: "rgba(255,255,255,0.05)", borderRadius: 100, border: "1px solid rgba(255,255,255,0.1)", marginBottom: 40 }}>
                <div style=${{ width: 8, height: 8, borderRadius: "50%", background: B.blue, boxShadow: \`0 0 10px \${B.blue}\` }} />
                <span style=${{ color: "white", fontSize: 12, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase" }}>Enterprise Grade</span>
              </div>
            </div>

            <div style=${{ position: "relative", zIndex: 1, marginTop: "auto", marginBottom: "80px" }}>
              <h1 style=${{ color: B.white, fontSize: 52, fontWeight: 800, lineHeight: 1.1, margin: "0 0 24px", letterSpacing: "-1px", fontFamily: DISPLAY }}>
                Join AIRES™<br />
                <span style=${{ background: "linear-gradient(90deg, #3B9BC8, #89C4E1)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Risk Profiler</span>
              </h1>
              <p style=${{ color: "rgba(255,255,255,0.65)", fontSize: 18, lineHeight: 1.6, margin: 0, maxWidth: 440, fontWeight: 400 }}>
                Create your account to start assessing AI risks and ensuring compliance.
              </p>
            </div>

            <div style=${{ position: "relative", zIndex: 1 }}>
              <\${BizcomLogo} />
            </div>
          </div>

          <div style=${{
            width: "52%", display: "flex", alignItems: "center", justifyContent: "center",
            padding: "80px 48px", background: "white"
          }}>
            <div style=${{ width: "100%", maxWidth: 460 }}>
              <div style=${{ marginBottom: 48 }}>
                <h2 style=${{ fontSize: 36, fontWeight: 900, color: B.black, margin: "0 0 12px", fontFamily: DISPLAY }}>Create Account</h2>
                <p style=${{ fontSize: 15, color: B.gray600, margin: 0, fontWeight: 500 }}>
                  Sign up to access the AI Risk Profiler
                </p>
              </div>

              \${error ? html\`
                <div style=\${{ background: "#FEE", border: "1px solid #FCC", padding: "14px 18px", borderRadius: 10, marginBottom: 24, color: "#C33", fontSize: 14, fontWeight: 600 }}>
                  ⚠️ \${error}
                </div>
              \` : null}

              \${success ? html\`
                <div style=\${{ background: "#E7F7ED", border: "1px solid #C3E6CB", padding: "14px 18px", borderRadius: 10, marginBottom: 24, color: "#155724", fontSize: 14, fontWeight: 600, lineHeight: 1.5 }}>
                  ✓ \${success}
                  <div style=\${{ fontSize: 12, marginTop: 8, fontWeight: 500 }}>Redirecting to login in 5 seconds...</div>
                </div>
              \` : null}

              <div style=${{ marginBottom: 20 }}>
                <label style=${{ display: "block", fontSize: 13, fontWeight: 700, color: B.gray700, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.05em" }}>Email Address</label>
                <input
                  type="email"
                  value=\${email}
                  onInput=\${e => setEmail(e.target.value)}
                  onKeyDown=\${handleKeyDown}
                  placeholder="you@company.com"
                  style=\${{
                    width: "100%", padding: "14px 18px", border: \`2px solid \${B.border}\`,
                    borderRadius: 10, fontSize: 15, fontFamily: BODY, transition: "all 0.2s",
                    boxSizing: "border-box"
                  }}
                  disabled=\${loading || !!success}
                />
              </div>

              <div style=${{ marginBottom: 20 }}>
                <label style=${{ display: "block", fontSize: 13, fontWeight: 700, color: B.gray700, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.05em" }}>Password</label>
                <div style=${{ position: "relative" }}>
                  <input
                    type=\${showPw ? "text" : "password"}
                    value=\${password}
                    onInput=\${e => setPassword(e.target.value)}
                    onKeyDown=\${handleKeyDown}
                    placeholder="Minimum 8 characters"
                    style=\${{
                      width: "100%", padding: "14px 18px", paddingRight: "48px",
                      border: \`2px solid \${B.border}\`, borderRadius: 10, fontSize: 15,
                      fontFamily: BODY, transition: "all 0.2s", boxSizing: "border-box"
                    }}
                    disabled=\${loading || !!success}
                  />
                  <button
                    onClick=\${() => setShowPw(!showPw)}
                    style=\${{
                      position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)",
                      background: "none", border: "none", cursor: "pointer", fontSize: 18,
                      opacity: 0.5, transition: "opacity 0.2s"
                    }}
                    disabled=\${loading || !!success}
                  >
                    \${showPw ? "🙈" : "👁️"}
                  </button>
                </div>
                <div style=${{ fontSize: 12, color: B.gray500, marginTop: 6, fontWeight: 500 }}>
                  At least 8 characters
                </div>
              </div>

              <div style=${{ marginBottom: 32 }}>
                <label style=${{ display: "block", fontSize: 13, fontWeight: 700, color: B.gray700, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.05em" }}>Confirm Password</label>
                <input
                  type=\${showPw ? "text" : "password"}
                  value=\${confirmPassword}
                  onInput=\${e => setConfirmPassword(e.target.value)}
                  onKeyDown=\${handleKeyDown}
                  placeholder="Re-enter password"
                  style=\${{
                    width: "100%", padding: "14px 18px", border: \`2px solid \${B.border}\`,
                    borderRadius: 10, fontSize: 15, fontFamily: BODY, transition: "all 0.2s",
                    boxSizing: "border-box"
                  }}
                  disabled=\${loading || !!success}
                />
              </div>

              <button
                onClick=\${doRegister}
                disabled=\${loading || !!success}
                className="auth-btn"
                style=\${{
                  width: "100%", padding: "16px", background: loading || success ? B.gray300 : B.blue,
                  color: "white", border: "none", borderRadius: 10, fontSize: 15,
                  fontWeight: 700, cursor: loading || success ? "not-allowed" : "pointer",
                  transition: "all 0.2s", fontFamily: BODY, marginBottom: 24
                }}
              >
                \${loading ? "Creating Account..." : success ? "Success!" : "Create Account"}
              </button>

              <div style=${{ textAlign: "center", fontSize: 14, color: B.gray600 }}>
                Already have an account?
                <button
                  onClick=\${onBack}
                  style=\${{
                    background: "none", border: "none", color: B.blue, fontWeight: 700,
                    cursor: "pointer", marginLeft: 6, textDecoration: "underline", fontFamily: BODY
                  }}
                >
                  Log in
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Register, {
      onBack: () => console.log("Back to login"),
      onSuccess: () => console.log("Registration success")
    }));
  </script>
</body>
</html>
